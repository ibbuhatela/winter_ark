<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Winter Arc — Fitness</title>
<style>
:root{--bg:#050914;--bg2:#0a1224;--card:rgba(16,27,48,.72);--line:rgba(170,220,255,.14);--text:#f4f8ff;--muted:#8fa5c4;--accent:#7dd3fc;--accent2:#60a5fa;--good:#67e8a5;--danger:#fb7185;--shadow:0 24px 70px rgba(0,0,0,.42)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;background:radial-gradient(circle at 20% 10%,#12335b 0,transparent 32%),radial-gradient(circle at 90% 0,#183c68 0,transparent 25%),linear-gradient(145deg,var(--bg),var(--bg2));color:var(--text)}
body{overflow-x:hidden}button,input,select{font:inherit}button{cursor:pointer}
#snow{position:fixed;inset:0;z-index:0;pointer-events:none}
.app{position:relative;z-index:1;min-height:100vh}
.hidden{display:none!important}
.auth{min-height:100vh;display:grid;place-items:center;padding:24px}
.auth-wrap{width:min(1100px,100%);display:grid;grid-template-columns:1.05fr .95fr;gap:30px;align-items:stretch}
.hero,.auth-card,.card{background:linear-gradient(145deg,rgba(20,35,61,.78),rgba(8,16,31,.74));border:1px solid var(--line);box-shadow:var(--shadow);backdrop-filter:blur(20px);border-radius:28px}
.hero{padding:52px;position:relative;overflow:hidden;min-height:620px;display:flex;flex-direction:column;justify-content:center}
.hero:before{content:"";position:absolute;width:330px;height:330px;border-radius:50%;background:rgba(96,165,250,.2);filter:blur(35px);right:-100px;top:-100px}
.logo{font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);font-size:14px}
.hero h1{font-size:clamp(50px,7vw,92px);line-height:.88;margin:18px 0;background:linear-gradient(180deg,#fff,#8bd8ff);-webkit-background-clip:text;color:transparent}
.hero p{font-size:18px;line-height:1.7;color:var(--muted);max-width:520px}
.stats{display:flex;gap:14px;flex-wrap:wrap;margin-top:30px}.pill{padding:10px 14px;border:1px solid var(--line);border-radius:999px;background:rgba(255,255,255,.04);color:#cfe7ff}
.auth-card{padding:34px;align-self:center}.auth-tabs{display:flex;background:rgba(255,255,255,.05);padding:5px;border-radius:14px;margin-bottom:24px}.auth-tabs button{flex:1;border:0;background:transparent;color:var(--muted);padding:12px;border-radius:10px}.auth-tabs .active{background:rgba(125,211,252,.14);color:#fff}
.form{display:grid;gap:14px}.field{display:grid;gap:7px}.field label{font-size:13px;color:#aac0dc}.field input,.field select{width:100%;background:rgba(3,9,20,.65);border:1px solid var(--line);color:#fff;padding:13px 14px;border-radius:12px;outline:none}.field input:focus,.field select:focus{border-color:rgba(125,211,252,.6);box-shadow:0 0 0 3px rgba(125,211,252,.08)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.primary,.secondary,.danger{border:0;border-radius:13px;padding:13px 16px;transition:.2s;}.primary{background:linear-gradient(135deg,#7dd3fc,#60a5fa);color:#03101e;font-weight:800}.secondary{background:rgba(255,255,255,.07);border:1px solid var(--line);color:#e9f4ff}.danger{background:rgba(251,113,133,.12);color:#ffb1bd;border:1px solid rgba(251,113,133,.22)}button:hover{transform:translateY(-1px);filter:brightness(1.08)}button:active{transform:scale(.98)}
.error{color:#ff9aa9;font-size:13px;min-height:18px}.fine{color:var(--muted);font-size:12px;line-height:1.5}
.onboard{min-height:100vh;display:grid;place-items:center;padding:24px}.onboard-card{width:min(760px,100%);padding:34px}
.step{display:none}.step.active{display:block}
.progress{height:7px;background:rgba(255,255,255,.07);border-radius:99px;overflow:hidden;margin:20px 0 28px}.progress i{display:block;height:100%;background:linear-gradient(90deg,#7dd3fc,#60a5fa);width:33.33%;transition:.3s}
.choice-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.choice{padding:16px;border:1px solid var(--line);border-radius:15px;background:rgba(255,255,255,.04);color:#cbd9ec;text-align:left}.choice.selected{border-color:rgba(125,211,252,.7);background:rgba(125,211,252,.12);color:white}
.topbar{height:76px;position:sticky;top:0;z-index:5;background:rgba(4,10,20,.72);backdrop-filter:blur(18px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 22px}.brand{font-weight:900;letter-spacing:.1em;color:#fff}.brand span{color:var(--accent)}.user-mini{display:flex;align-items:center;gap:10px}.avatar{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#7dd3fc,#2563eb);color:#03101e;font-weight:900}
.layout{display:grid;grid-template-columns:230px 1fr;min-height:calc(100vh - 76px)}.side{padding:20px 14px;border-right:1px solid var(--line);background:rgba(3,9,18,.42);position:sticky;top:76px;height:calc(100vh - 76px)}.nav{display:grid;gap:6px}.nav button{border:0;background:transparent;color:#8fa5c4;text-align:left;padding:12px 13px;border-radius:12px}.nav button.active,.nav button:hover{background:rgba(125,211,252,.1);color:#fff}.main{padding:30px;max-width:1500px;width:100%;margin:auto}.view{display:none}.view.active{display:block}.heading{display:flex;justify-content:space-between;gap:16px;align-items:end;margin-bottom:24px}.heading h2{font-size:30px;margin:0}.heading p{color:var(--muted);margin:6px 0 0}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}.card{padding:20px}.metric{font-size:30px;font-weight:850;margin-top:8px}.label{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.dashboard-grid{display:grid;grid-template-columns:1.35fr .65fr;gap:15px;margin-top:15px}.wide{min-height:260px}.ring-wrap{display:flex;align-items:center;gap:25px}.ring{width:150px;height:150px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--accent) 0deg,#20324d 0deg);position:relative}.ring:after{content:"";position:absolute;inset:12px;background:#0a1426;border-radius:50%}.ring strong{position:relative;z-index:1;font-size:28px}.list{display:grid;gap:10px}.row{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:13px;border:1px solid var(--line);background:rgba(255,255,255,.035);border-radius:14px}.check{width:22px;height:22px;accent-color:#7dd3fc}.workout-days{display:grid;grid-template-columns:repeat(7,1fr);gap:9px}.day{padding:13px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.035);min-height:105px}.day strong{font-size:12px}.day p{font-size:13px;color:#a9bdd6}.day.today{border-color:rgba(125,211,252,.7);box-shadow:0 0 25px rgba(96,165,250,.1)}
.chart{height:280px;width:100%;position:relative}.chart canvas{width:100%;height:100%}
.progressbar{height:10px;border-radius:99px;background:#1b2b44;overflow:hidden}.progressbar i{display:block;height:100%;background:linear-gradient(90deg,#7dd3fc,#60a5fa);border-radius:inherit}
.toolbar{display:flex;gap:9px;flex-wrap:wrap}.toolbar input,.toolbar select{background:rgba(255,255,255,.05);border:1px solid var(--line);color:#fff;border-radius:11px;padding:10px}
.modal{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.68);display:none;place-items:center;padding:20px}.modal.show{display:grid}.modal-box{width:min(620px,100%);padding:26px;border-radius:24px;background:#0b1628;border:1px solid var(--line);box-shadow:var(--shadow)}
.exercise-grid{display:grid;gap:10px}.exercise{display:grid;grid-template-columns:1.4fr repeat(3,.7fr) auto;gap:8px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:14px}.exercise input{width:100%;background:#07101e;border:1px solid var(--line);color:#fff;padding:9px;border-radius:9px}
.badges{display:grid;grid-template-columns:repeat(4,1fr);gap:13px}.badge{text-align:center;padding:22px;border:1px solid var(--line);border-radius:18px;background:rgba(255,255,255,.035)}.badge.locked{opacity:.35;filter:grayscale(1)}.badge .emoji{font-size:34px}.badge h4{margin:10px 0 5px}.badge small{color:var(--muted)}
.toast{position:fixed;right:22px;bottom:22px;z-index:50;padding:13px 16px;border:1px solid var(--line);background:#0b182b;color:#fff;border-radius:13px;box-shadow:var(--shadow);transform:translateY(20px);opacity:0;transition:.25s}.toast.show{transform:translateY(0);opacity:1}
.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}.calcell{min-height:75px;padding:8px;border:1px solid var(--line);border-radius:10px;background:rgba(255,255,255,.025);font-size:12px}.calcell b{font-size:13px}.calcell.done{background:rgba(103,232,165,.08);border-color:rgba(103,232,165,.25)}.calcell.today{outline:2px solid rgba(125,211,252,.5)}
@media(max-width:1000px){.auth-wrap{grid-template-columns:1fr}.hero{min-height:auto;padding:35px}.cards{grid-template-columns:repeat(2,1fr)}.dashboard-grid{grid-template-columns:1fr}.layout{grid-template-columns:1fr}.side{position:sticky;top:76px;height:auto;border-right:0;border-bottom:1px solid var(--line);padding:8px;z-index:4}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap}.main{padding:20px}.badges{grid-template-columns:repeat(2,1fr)}}
@media(max-width:600px){.hero h1{font-size:55px}.auth-card{padding:22px}.grid2,.choice-grid,.cards{grid-template-columns:1fr}.main{padding:14px}.workout-days{grid-template-columns:repeat(2,1fr)}.topbar{padding:0 13px}.exercise{grid-template-columns:1fr 1fr}.exercise .del{grid-column:span 2}}
</style>
</head>
<body>
<canvas id="snow"></canvas>
<div id="app" class="app"></div>
<div id="toast" class="toast"></div>

<script>
"use strict";
const KEY="winterArcUsers_v1", SESSION="winterArcSession_v1";
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const uid=()=>Math.random().toString(36).slice(2)+Date.now().toString(36);
const today=()=>new Date().toISOString().slice(0,10);
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
function loadUsers(){try{return JSON.parse(localStorage.getItem(KEY)||"{}")}catch{return {}}}
function saveUsers(u){localStorage.setItem(KEY,JSON.stringify(u))}
function getUser(){const email=localStorage.getItem(SESSION);return email?loadUsers()[email]:null}
function setUser(u){const users=loadUsers();users[u.email]=u;saveUsers(users)}
function toast(msg){const t=$("#toast");t.textContent=msg;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2400)}
function validGmail(e){return /^[a-zA-Z0-9._%+-]+@gmail\.com$/.test(e.trim())}
function baseUser(data){return {email:data.email.toLowerCase(),password:data.password,name:data.name,age:data.age,gender:data.gender,height:+data.height,weight:+data.weight,goal:data.goal,experience:data.experience||"Beginner",location:data.location||"Gym",workoutDays:+data.workoutDays||5,waterGoal:+data.waterGoal||3,sleepGoal:+data.sleepGoal||8,targetWeight:+data.targetWeight||+data.weight,created:today(),water:{},sleep:{},weights:{[today()]:+data.weight},workouts:{},habits:{},nutrition:{},achievements:[],settings:{snow:true,sound:false,theme:"dark",units:"kg"},plan:["Chest + Triceps","Back + Biceps","Legs","Shoulders","Rest","Chest + Triceps","Rest"]}}
function authScreen(tab="login"){
$("#app").innerHTML=`<section class="auth"><div class="auth-wrap">
<div class="hero"><div class="logo">❄ Winter Arc</div><h1>BUILD.<br>DISCIPLINE.<br>REPEAT.</h1><p>Your personal fitness command center. Track workouts, hydration, sleep, habits and progress — all in one winter-themed dashboard.</p><div class="stats"><span class="pill">🏋️ Smart workouts</span><span class="pill">📊 Real progress</span><span class="pill">❄️ Winter mode</span></div></div>
<div class="auth-card"><div class="auth-tabs"><button id="tabLogin" class="${tab==="login"?"active":""}">Login</button><button id="tabSignup" class="${tab==="signup"?"active":""}">Create account</button></div>
<div id="loginForm" class="${tab==="login"?"":"hidden"}"><form class="form" id="lf"><div class="field"><label>Gmail address</label><input id="le" type="email" placeholder="you@gmail.com" required></div><div class="field"><label>Password</label><input id="lp" type="password" placeholder="••••••••" required></div><div id="loginErr" class="error"></div><button class="primary">Enter Winter Arc →</button><div class="fine">Prototype note: account data is stored in this browser. Production apps should use secure backend authentication.</div></form></div>
<div id="signupForm" class="${tab==="signup"?"":"hidden"}"><form class="form" id="sf">
<div class="grid2"><div class="field"><label>Full name</label><input id="sn" required></div><div class="field"><label>Gmail address</label><input id="se" type="email" placeholder="you@gmail.com" required></div></div>
<div class="grid2"><div class="field"><label>Password</label><input id="sp" type="password" minlength="6" required></div><div class="field"><label>Confirm password</label><input id="sc" type="password" required></div></div>
<div class="grid2"><div class="field"><label>Age</label><input id="sa" type="number" min="13" max="100" required></div><div class="field"><label>Gender</label><select id="sg"><option>Prefer not to say</option><option>Male</option><option>Female</option></select></div></div>
<div class="grid2"><div class="field"><label>Height (cm)</label><input id="sh" type="number" min="80" max="250" required></div><div class="field"><label>Weight (kg)</label><input id="sw" type="number" min="20" max="400" step=".1" required></div></div>
<div class="field"><label>Fitness goal</label><select id="sgoal"><option>Build Muscle</option><option>Lose Fat</option><option>Lose Weight</option><option>Gain Weight</option><option>Improve Strength</option><option>Improve Fitness</option><option>Maintain Fitness</option></select></div>
<div id="signupErr" class="error"></div><button class="primary">Create my Winter Arc →</button><div class="fine">Only Gmail addresses ending exactly in @gmail.com are accepted.</div>
</form></div></div></div></section>`;
$("#tabLogin").onclick=()=>authScreen("login");$("#tabSignup").onclick=()=>authScreen("signup");
$("#lf").onsubmit=e=>{e.preventDefault();const email=$("#le").value.trim().toLowerCase(),u=loadUsers()[email];if(!validGmail(email))return $("#loginErr").textContent="Please enter a valid Gmail address ending with @gmail.com.";if(!u)return $("#loginErr").textContent="Account not found. Please create an account first.";if(u.password!==$("#lp").value)return $("#loginErr").textContent="Incorrect email or password.";localStorage.setItem(SESSION,email);render()};
$("#sf").onsubmit=e=>{e.preventDefault();const email=$("#se").value.trim().toLowerCase(), users=loadUsers();if(!validGmail(email))return $("#signupErr").textContent="Please enter a valid Gmail address ending with @gmail.com.";if(users[email])return $("#signupErr").textContent="An account with this Gmail already exists. Please log in.";if($("#sp").value!==$("#sc").value)return $("#signupErr").textContent="Passwords do not match.";if($("#sp").value.length<6)return $("#signupErr").textContent="Password must be at least 6 characters.";const u=baseUser({email,password:$("#sp").value,name:$("#sn").value.trim(),age:$("#sa").value,gender:$("#sg").value,height:$("#sh").value,weight:$("#sw").value,goal:$("#sgoal").value});setUser(u);localStorage.setItem(SESSION,email);onboarding(u)};
}
function onboarding(u){
$("#app").innerHTML=`<section class="onboard"><div class="onboard-card card"><div class="logo">❄ WINTER ARC / SETUP</div><h2>Welcome, ${esc(u.name)}.</h2><p style="color:var(--muted)">Let's personalize your plan. You can change these later.</p><div class="progress"><i id="op"></i></div>
<div class="step active" data-step="1"><h3>How do you train?</h3><div class="choice-grid" id="exp"><button class="choice selected">Beginner</button><button class="choice">Intermediate</button><button class="choice">Advanced</button></div><h3>Where?</h3><div class="choice-grid" id="loc"><button class="choice selected">Gym</button><button class="choice">Home</button><button class="choice">Both</button></div></div>
<div class="step" data-step="2"><h3>Set your daily targets</h3><div class="grid2"><div class="field"><label>Water goal (litres)</label><input id="ow" type="number" min="0.5" max="10" step=".1" value="${u.waterGoal}"></div><div class="field"><label>Sleep goal (hours)</label><input id="os" type="number" min="4" max="14" step=".1" value="${u.sleepGoal}"></div></div><div class="field" style="margin-top:12px"><label>Workout days per week</label><input id="od" type="number" min="1" max="7" value="${u.workoutDays}"></div></div>
<div class="step" data-step="3"><h3>Target weight</h3><div class="field"><label>Target weight (kg)</label><input id="ot" type="number" min="20" max="400" step=".1" value="${u.targetWeight}"></div><p class="fine">This app is a tracking tool, not medical advice. Set goals that are appropriate for you.</p></div>
<div style="display:flex;justify-content:space-between;margin-top:25px"><button id="oback" class="secondary">Back</button><button id="onext" class="primary">Continue →</button></div></div></section>`;
let step=1, exp="Beginner",loc="Gym";function selectGroup(id,cb){$$(`#${id} .choice`).forEach(b=>b.onclick=()=>{$$(`#${id} .choice`).forEach(x=>x.classList.remove("selected"));b.classList.add("selected");cb(b.textContent)})}selectGroup("exp",x=>exp=x);selectGroup("loc",x=>loc=x);$("#oback").onclick=()=>{if(step>1){step--;update()}};$("#onext").onclick=()=>{if(step<3){step++;update()}else{u.experience=exp;u.location=loc;u.waterGoal=+$("#ow").value||3;u.sleepGoal=+$("#os").value||8;u.workoutDays=Math.max(1,Math.min(7,+$("#od").value||5));u.targetWeight=+$("#ot").value||u.weight;setUser(u);render()}};function update(){$$(".step").forEach(s=>s.classList.toggle("active",+s.dataset.step===step));$("#op").style.width=(step/3*100)+"%";$("#oback").style.visibility=step===1?"hidden":"visible";$("#onext").textContent=step===3?"Finish setup ✓":"Continue →"}}
function render(){const u=getUser();if(!u)return authScreen();if(!u.onboardDone){u.onboardDone=true;setUser(u)}shell();showView("dashboard")}
function shell(){
const u=getUser(),initials=u.name.split(/\s+/).map(x=>x[0]).slice(0,2).join("").toUpperCase();
$("#app").innerHTML=`<header class="topbar"><div class="brand">❄ <span>WINTER</span> ARC</div><div class="user-mini"><span>${esc(u.name)}</span><div class="avatar">${initials}</div></div></header><div class="layout"><aside class="side"><div class="nav">
<button data-view="dashboard">🏠 Dashboard</button><button data-view="workout">🏋️ Workout</button><button data-view="progress">📊 Progress</button><button data-view="water">💧 Water</button><button data-view="sleep">😴 Sleep</button><button data-view="nutrition">🥗 Nutrition</button><button data-view="habits">✅ Habits</button><button data-view="calendar">📅 Calendar</button><button data-view="achievements">🏆 Achievements</button><button data-view="profile">👤 Profile</button><button data-view="settings">⚙️ Settings</button></div></aside><main class="main">
<div id="dashboard" class="view"></div><div id="workout" class="view"></div><div id="progress" class="view"></div><div id="water" class="view"></div><div id="sleep" class="view"></div><div id="nutrition" class="view"></div><div id="habits" class="view"></div><div id="calendar" class="view"></div><div id="achievements" class="view"></div><div id="profile" class="view"></div><div id="settings" class="view"></div>
</main></div>`;
$$(".nav button").forEach(b=>b.onclick=()=>showView(b.dataset.view));refreshAll();
}
function showView(v){$$(".view").forEach(x=>x.classList.remove("active"));$("#"+v).classList.add("active");$$(".nav button").forEach(b=>b.classList.toggle("active",b.dataset.view===v));refreshAll(v)}
function refreshAll(){dashboard();workout();progress();waterView();sleepView();nutrition();habits();calendar();achievements();profile();settings();wireDynamic()}
function dayIndex(){const start=new Date(getUser().created+"T00:00:00"),now=new Date(today()+"T00:00:00");return Math.floor((now-start)/86400000)%7}
function todayWorkout(){return getUser().plan[dayIndex()]||"Rest"}
function getDay(o){return o[today()]||0}
function dashboard(){const u=getUser(),w=getDay(u.water),s=getDay(u.sleep),done=u.workouts[today()]?.done||0,total=u.workouts[today()]?.total||5,wp=Math.min(100,Math.round(w/u.waterGoal*100)),sp=Math.min(100,Math.round(s/u.sleepGoal*100)),cp=Math.min(100,Math.round(done/Math.max(1,total)*100));$("#dashboard").innerHTML=`<div class="heading"><div><h2>Good day, ${esc(u.name.split(" ")[0])} ❄️</h2><p>${new Date().toLocaleDateString(undefined,{weekday:"long",month:"long",day:"numeric",year:"numeric"})} · Day ${dayIndex()+1} of your weekly cycle</p></div><button class="primary" data-go="workout">Start workout</button></div><div class="cards"><div class="card"><div class="label">Today's workout</div><div class="metric" style="font-size:21px">${esc(todayWorkout())}</div></div><div class="card"><div class="label">Water</div><div class="metric">${w.toFixed(1)}L</div><div class="progressbar"><i style="width:${wp}%"></i></div></div><div class="card"><div class="label">Sleep</div><div class="metric">${s.toFixed(1)}h</div><div class="progressbar"><i style="width:${sp}%"></i></div></div><div class="card"><div class="label">Workout</div><div class="metric">${cp}%</div><div class="progressbar"><i style="width:${cp}%"></i></div></div></div>
<div class="dashboard-grid"><div class="card wide"><div class="label">Daily completion</div><div class="ring-wrap" style="margin-top:25px"><div class="ring" style="background:conic-gradient(var(--accent) ${cp*3.6}deg,#20324d 0deg)"><strong>${cp}%</strong></div><div><h3 style="margin:0 0 8px">${cp>=100?"Winter Warrior mode.":"Keep pushing."}</h3><p style="color:var(--muted)">Complete today's workout, hit your hydration target and protect your sleep routine.</p><div class="toolbar"><button class="secondary" data-go="water">Log water</button><button class="secondary" data-go="sleep">Log sleep</button></div></div></div></div><div class="card"><div class="label">Motivation</div><h3 id="quote" style="font-size:25px;line-height:1.25">Discipline beats motivation.</h3><p style="color:var(--muted)">Your future self will thank you.</p></div></div>
<div class="card" style="margin-top:15px"><div class="label">7-day cycle</div><div class="workout-days" style="margin-top:14px">${u.plan.map((x,i)=>`<div class="day ${i===dayIndex()?"today":""}"><strong>DAY ${i+1}</strong><p>${esc(x)}</p></div>`).join("")}</div></div>`}
function workout(){const u=getUser(),d=u.workouts[today()]||{exercises:defaultExercises(todayWorkout()),done:0,total:5};$("#workout").innerHTML=`<div class="heading"><div><h2>Workout</h2><p>Today · Day ${dayIndex()+1} · ${esc(todayWorkout())}</p></div><div class="toolbar"><button class="secondary" id="timerBtn">Start timer</button><button class="primary" id="saveWorkout">Save workout</button></div></div><div class="card"><div class="toolbar" style="justify-content:space-between"><span class="pill">🔥 ${workoutCount(u)} completed workouts</span><button class="secondary" id="addExercise">+ Add exercise</button></div><div class="exercise-grid" id="exerciseList" style="margin-top:14px">${d.exercises.map((e,i)=>`<div class="exercise"><div><b>${esc(e.name)}</b><div class="fine">${esc(e.muscle)}</div></div><input data-i="${i}" data-k="sets" type="number" min="0" value="${e.sets}" title="sets"><input data-i="${i}" data-k="reps" type="number" min="0" value="${e.reps}" title="reps"><input data-i="${i}" data-k="weight" type="number" min="0" step=".5" value="${e.weight}" title="weight kg"><button class="danger del" data-del="${i}">Delete</button></div>`).join("")}</div><div style="margin-top:18px"><label><input id="workoutDone" class="check" type="checkbox" ${d.done>=d.total?"checked":""}> Mark today's workout complete</label></div></div>
<div class="card" style="margin-top:15px"><div class="label">7-day plan</div><div class="grid2" style="margin-top:12px">${u.plan.map((x,i)=>`<div class="field"><label>Day ${i+1}</label><input class="planInput" data-day="${i}" value="${esc(x)}"></div>`).join("")}</div><button class="primary" id="savePlan" style="margin-top:15px">Save 7-day plan</button></div>
<div id="timer" class="card hidden" style="margin-top:15px;text-align:center"><div class="label">Workout timer</div><div id="time" style="font-size:60px;font-weight:900;margin:8px">00:00</div><button class="secondary" id="resetTimer">Reset</button></div>`}
function defaultExercises(name){if(/Rest/i.test(name))return[{name:"Recovery / Rest",muscle:"Recovery",sets:0,reps:0,weight:0}];return[{name:name,muscle:"Main focus",sets:3,reps:10,weight:0},{name:"Warm-up",muscle:"Full body",sets:1,reps:10,weight:0}]}
function workoutCount(u){return Object.values(u.workouts).filter(x=>x.done>=x.total&&x.total>0).length}
function progress(){const u=getUser();$("#progress").innerHTML=`<div class="heading"><div><h2>Progress</h2><p>Your charts are based on data you enter.</p></div></div><div class="cards"><div class="card"><div class="label">Starting weight</div><div class="metric">${u.weight} kg</div></div><div class="card"><div class="label">Current weight</div><div class="metric">${latestWeight(u)} kg</div></div><div class="card"><div class="label">Target</div><div class="metric">${u.targetWeight} kg</div></div><div class="card"><div class="label">Workouts</div><div class="metric">${workoutCount(u)}</div></div></div><div class="card" style="margin-top:15px"><div class="label">Weight history</div><div class="chart"><canvas id="weightChart"></canvas></div></div><div class="card" style="margin-top:15px"><div class="label">Water & sleep history</div><div class="chart"><canvas id="healthChart"></canvas></div></div>`;setTimeout(drawCharts,0)}
function latestWeight(u){const a=Object.entries(u.weights).sort();return a.length?+a[a.length-1][1]:u.weight}
function series(obj,n=14){const out=[];for(let i=n-1;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);const k=d.toISOString().slice(0,10);out.push({k,v:+(obj[k]||0)})}return out}
function drawLine(canvas,data,second=null){if(!canvas)return;const r=canvas.getBoundingClientRect(),dpr=devicePixelRatio||1;canvas.width=r.width*dpr;canvas.height=r.height*dpr;const c=canvas.getContext("2d");c.scale(dpr,dpr);const W=r.width,H=r.height,p=35;const vals=data.map(x=>x.v).concat(second?second.map(x=>x.v):[]),max=Math.max(...vals,1),min=Math.min(...vals.filter(v=>v>0),0),range=max-min||1;c.strokeStyle="rgba(170,220,255,.12)";c.fillStyle="#8fa5c4";c.font="11px system-ui";for(let i=0;i<5;i++){const y=p+i*(H-p*2)/4;c.beginPath();c.moveTo(p,y);c.lineTo(W-p,y);c.stroke()}function line(arr,offset){c.beginPath();arr.forEach((x,i)=>{const xx=p+i*(W-p*2)/Math.max(1,arr.length-1),yy=H-p-(x.v-min)/range*(H-p*2);i?c.lineTo(xx,yy):c.moveTo(xx,yy)});c.strokeStyle=offset?"#67e8a5":"#7dd3fc";c.lineWidth=3;c.stroke()}line(data,0);if(second)line(second,1);data.forEach((x,i)=>{if(i%3===0)c.fillText(x.k.slice(5),p+i*(W-p*2)/Math.max(1,data.length-1),H-10)});if(second){c.fillStyle="#7dd3fc";c.fillText("Water",p,18);c.fillStyle="#67e8a5";c.fillText("Sleep",p+65,18)}}
function drawCharts(){const u=getUser();drawLine($("#weightChart"),series(u.weights));drawLine($("#healthChart"),series(u.water),series(u.sleep))}
function waterView(){const u=getUser(),v=getDay(u.water),pct=Math.min(100,Math.round(v/u.waterGoal*100));$("#water").innerHTML=`<div class="heading"><div><h2>Hydration</h2><p>Daily goal: ${u.waterGoal}L</p></div></div><div class="dashboard-grid"><div class="card"><div class="ring-wrap"><div class="ring" style="background:conic-gradient(var(--accent) ${pct*3.6}deg,#20324d 0deg)"><strong>${pct}%</strong></div><div><div class="label">Today</div><div class="metric">${v.toFixed(1)}L / ${u.waterGoal}L</div><p style="color:var(--muted)">Every glass counts.</p></div></div><div class="toolbar" style="margin-top:25px">${[.25,.5,1].map(x=>`<button class="secondary waterAdd" data-x="${x}">+ ${x}L</button>`).join("")}<button class="danger" id="waterReset">Reset day</button></div></div><div class="card"><div class="label">Set daily goal</div><div class="field" style="margin-top:12px"><input id="waterGoal" type="number" step=".1" min=".5" max="10" value="${u.waterGoal}"></div><button class="primary" id="saveWaterGoal" style="margin-top:10px">Save goal</button></div></div>`}
function sleepView(){const u=getUser(),v=getDay(u.sleep),pct=Math.min(100,Math.round(v/u.sleepGoal*100));$("#sleep").innerHTML=`<div class="heading"><div><h2>Sleep</h2><p>Recovery is part of training.</p></div></div><div class="dashboard-grid"><div class="card"><div class="label">Hours slept today</div><div class="metric">${v.toFixed(1)}h</div><div class="progressbar" style="margin:14px 0"><i style="width:${pct}%"></i></div><div class="grid2"><div class="field"><label>Hours</label><input id="sleepHours" type="number" step=".1" min="0" max="24" value="${v||""}"></div><div class="field"><label>Bedtime</label><input id="bed" type="time" value="${u.sleep[today()+"_bed"]||""}"></div><div class="field"><label>Wake time</label><input id="wake" type="time" value="${u.sleep[today()+"_wake"]||""}"></div><div class="field"><label>Goal (hours)</label><input id="sleepGoal" type="number" step=".1" min="4" max="14" value="${u.sleepGoal}"></div></div><button class="primary" id="saveSleep" style="margin-top:14px">Save sleep</button></div><div class="card"><div class="label">Target</div><div class="metric">${u.sleepGoal}h</div><p style="color:var(--muted)">Track your actual sleep rather than guessing. Your history will feed the progress chart.</p></div></div>`}
function nutrition(){const u=getUser(),n=u.nutrition[today()]||[];const totals=n.reduce((a,x)=>{a.c+=+x.cal||0;a.p+=+x.pro||0;a.carb+=+x.carb||0;a.f+=+x.fat||0;return a},{c:0,p:0,carb:0,f:0});$("#nutrition").innerHTML=`<div class="heading"><div><h2>Nutrition</h2><p>Simple food logging — not medical advice.</p></div><button class="primary" id="addMeal">+ Add meal</button></div><div class="cards"><div class="card"><div class="label">Calories</div><div class="metric">${totals.c}</div></div><div class="card"><div class="label">Protein</div><div class="metric">${totals.p}g</div></div><div class="card"><div class="label">Carbs</div><div class="metric">${totals.carb}g</div></div><div class="card"><div class="label">Fat</div><div class="metric">${totals.f}g</div></div></div><div class="card" style="margin-top:15px"><div class="list">${n.length?n.map((x,i)=>`<div class="row"><span><b>${esc(x.name)}</b><small class="fine"> · ${x.cal} kcal · P ${x.pro}g · C ${x.carb}g · F ${x.fat}g</small></span><button class="danger delMeal" data-i="${i}">Delete</button></div>`).join(""):"<p style='color:var(--muted)'>No meals logged today.</p>"}</div></div>`}
function habits(){const u=getUser(),defaults=["Workout","Drink enough water","Sleep 8 hours","Eat healthy","Walk","Stretch","Read","Wake up early"],h=u.habits[today()]||{};$("#habits").innerHTML=`<div class="heading"><div><h2>Habits</h2><p>Build consistency one check at a time.</p></div></div><div class="card"><div class="list">${defaults.map(x=>`<label class="row"><span>✓ ${x}</span><input class="check habitCheck" type="checkbox" data-h="${esc(x)}" ${h[x]?"checked":""}></label>`).join("")}</div></div><div class="card" style="margin-top:15px"><div class="label">Custom habit</div><div class="toolbar" style="margin-top:12px"><input id="customHabit" placeholder="e.g. 10 min meditation"><button class="primary" id="addHabit">Add</button></div></div>`}
function calendar(){const u=getUser(),d=new Date(),y=d.getFullYear(),m=d.getMonth(),first=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate();let cells="";for(let i=0;i<first;i++)cells+=`<div></div>`;for(let n=1;n<=days;n++){const k=`${y}-${String(m+1).padStart(2,"0")}-${String(n).padStart(2,"0")}`,done=u.workouts[k]?.done>=u.workouts[k]?.total&&u.workouts[k]?.total>0;cells+=`<div class="calcell ${done?"done":""} ${k===today()?"today":""}"><b>${n}</b><div class="fine">${done?"✓ workout":""}</div></div>`}$("#calendar").innerHTML=`<div class="heading"><div><h2>Calendar</h2><p>${d.toLocaleDateString(undefined,{month:"long",year:"numeric"})}</p></div></div><div class="card"><div class="calendar">${["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].map(x=>`<div class="fine">${x}</div>`).join("")}${cells}</div></div>`}
function achievements(){const u=getUser(),count=workoutCount(u),waterDays=Object.values(u.water).filter(v=>v>=u.waterGoal).length,streak=calcStreak(u);const bs=[["🏆","First Workout",count>=1],["🔥","7 Day Streak",streak>=7],["🔥","30 Day Streak",streak>=30],["💧","Hydration Hero",waterDays>=7],["💪","50 Workouts",count>=50],["🏋️","100 Workouts",count>=100],["⭐","Winter Arc Started",true],["❄️","Winter Warrior",count>=10&&waterDays>=7]];$("#achievements").innerHTML=`<div class="heading"><div><h2>Achievements</h2><p>${bs.filter(x=>x[2]).length} / ${bs.length} unlocked</p></div></div><div class="badges">${bs.map(x=>`<div class="badge ${x[2]?"":"locked"}"><div class="emoji">${x[0]}</div><h4>${x[1]}</h4><small>${x[2]?"Unlocked":"Keep going"}</small></div>`).join("")}</div>`}
function calcStreak(u){let s=0;for(let i=0;i<365;i++){const d=new Date();d.setDate(d.getDate()-i);const k=d.toISOString().slice(0,10);if(u.workouts[k]?.done>=u.workouts[k]?.total&&u.workouts[k]?.total>0)s++;else if(i>0)break}return s}
function profile(){const u=getUser();$("#profile").innerHTML=`<div class="heading"><div><h2>Profile</h2><p>Your Winter Arc identity.</p></div></div><div class="card"><div class="grid2"><div class="field"><label>Name</label><input id="pn" value="${esc(u.name)}"></div><div class="field"><label>Gmail</label><input value="${esc(u.email)}" disabled></div><div class="field"><label>Age</label><input id="pa" type="number" value="${u.age}"></div><div class="field"><label>Height (cm)</label><input id="ph" type="number" value="${u.height}"></div><div class="field"><label>Current weight (kg)</label><input id="pw" type="number" step=".1" value="${latestWeight(u)}"></div><div class="field"><label>Target weight (kg)</label><input id="pt" type="number" step=".1" value="${u.targetWeight}"></div><div class="field"><label>Goal</label><input id="pg" value="${esc(u.goal)}"></div><div class="field"><label>Experience</label><input id="pe" value="${esc(u.experience)}"></div></div><button class="primary" id="saveProfile" style="margin-top:15px">Save profile</button></div>`}
function settings(){const u=getUser();$("#settings").innerHTML=`<div class="heading"><div><h2>Settings</h2><p>Customize your experience.</p></div></div><div class="card"><div class="list"><label class="row"><span>❄️ Snow effect</span><input id="snowToggle" class="check" type="checkbox" ${u.settings.snow?"checked":""}></label><label class="row"><span>🔊 Sound effects</span><input id="soundToggle" class="check" type="checkbox" ${u.settings.sound?"checked":""}></label><label class="row"><span>Units</span><select id="units"><option ${u.settings.units==="kg"?"selected":""}>kg</option><option ${u.settings.units==="lb"?"selected":""}>lb</option></select></label></div></div><div class="card" style="margin-top:15px"><h3>Account</h3><p class="fine">Log out to return to the login screen. Your local prototype data remains saved.</p><div class="toolbar"><button class="secondary" id="logout">Logout</button><button class="danger" id="deleteAccount">Delete account</button></div></div>`}
function wireDynamic(){
$$("[data-go]").forEach(b=>b.onclick=()=>showView(b.dataset.go));
const u=getUser();
$$(".waterAdd").forEach(b=>b.onclick=()=>{u.water[today()]=Math.max(0,(u.water[today()]||0)+(+b.dataset.x));setUser(u);toast("Water logged 💧");refreshAll()});
if($("#waterReset"))$("#waterReset").onclick=()=>{u.water[today()]=0;setUser(u);refreshAll()};
if($("#saveWaterGoal"))$("#saveWaterGoal").onclick=()=>{u.waterGoal=+$("#waterGoal").value||3;setUser(u);toast("Water goal saved");refreshAll()};
if($("#saveSleep"))$("#saveSleep").onclick=()=>{u.sleep[today()]=+$("#sleepHours").value||0;u.sleep[today()+"_bed"]=$("#bed").value;u.sleep[today()+"_wake"]=$("#wake").value;u.sleepGoal=+$("#sleepGoal").value||8;setUser(u);toast("Sleep saved 😴");refreshAll()};
if($("#saveProfile"))$("#saveProfile").onclick=()=>{u.name=$("#pn").value.trim()||u.name;u.age=+$("#pa").value||u.age;u.height=+$("#ph").value||u.height;const nw=+$("#pw").value||latestWeight(u);u.weights[today()]=nw;u.targetWeight=+$("#pt").value||u.targetWeight;u.goal=$("#pg").value;u.experience=$("#pe").value;setUser(u);toast("Profile updated");refreshAll()};
if($("#savePlan"))$("#savePlan").onclick=()=>{$$(".planInput").forEach(x=>u.plan[+x.dataset.day]=x.value.trim()||"Rest");setUser(u);toast("7-day plan saved");refreshAll()};
$$(".del").forEach(b=>b.onclick=()=>{const d=u.workouts[today()]||{exercises:defaultExercises(todayWorkout())};d.exercises.splice(+b.dataset.del,1);d.total=d.exercises.length;u.workouts[today()]=d;setUser(u);refreshAll()});
$$("#exerciseList input").forEach(inp=>inp.onchange=()=>{const d=u.workouts[today()]||{exercises:defaultExercises(todayWorkout()),done:0,total:2};d.exercises[+inp.dataset.i][inp.dataset.k]=+inp.value||0;d.total=d.exercises.length;u.workouts[today()]=d;setUser(u)});
if($("#addExercise"))$("#addExercise").onclick=()=>{const d=u.workouts[today()]||{exercises:defaultExercises(todayWorkout()),done:0,total:2};d.exercises.push({name:"New exercise",muscle:"Custom",sets:3,reps:10,weight:0});d.total=d.exercises.length;u.workouts[today()]=d;setUser(u);refreshAll()};
if($("#saveWorkout"))$("#saveWorkout").onclick=()=>{const d=u.workouts[today()]||{exercises:defaultExercises(todayWorkout())};d.total=d.exercises.length;d.done=$("#workoutDone").checked?d.total:0;d.updated=Date.now();u.workouts[today()]=d;setUser(u);checkAchievements();toast("Workout saved 🔥");refreshAll()};
if($("#timerBtn"))$("#timerBtn").onclick=()=>timer();
if($("#addMeal"))$("#addMeal").onclick=()=>mealModal();
$$(".delMeal").forEach(b=>b.onclick=()=>{u.nutrition[today()].splice(+b.dataset.i,1);setUser(u);refreshAll()});
$$(".habitCheck").forEach(c=>c.onchange=()=>{u.habits[today()]=u.habits[today()]||{};u.habits[today()][c.dataset.h]=c.checked;setUser(u);toast(c.checked?"Habit completed ✓":"Habit unchecked");refreshAll()});
if($("#addHabit"))$("#addHabit").onclick=()=>{const x=$("#customHabit").value.trim();if(!x)return;u.habits[today()]=u.habits[today()]||{};u.habits[today()][x]=false;setUser(u);refreshAll()};
if($("#logout"))$("#logout").onclick=()=>{localStorage.removeItem(SESSION);authScreen()};
if($("#deleteAccount"))$("#deleteAccount").onclick=()=>{if(confirm("Delete this account and all local data? This cannot be undone.")){const us=loadUsers();delete us[u.email];saveUsers(us);localStorage.removeItem(SESSION);authScreen()}};
if($("#snowToggle"))$("#snowToggle").onchange=()=>{u.settings.snow=$("#snowToggle").checked;setUser(u);toggleSnow()};
if($("#soundToggle"))$("#soundToggle").onchange=()=>{u.settings.sound=$("#soundToggle").checked;setUser(u)};
if($("#units"))$("#units").onchange=()=>{u.settings.units=$("#units").value;setUser(u);toast("Units updated")};
}
function mealModal(){const m=document.createElement("div");m.className="modal show";m.innerHTML=`<div class="modal-box"><h3>Add meal</h3><form id="mf" class="form"><div class="field"><label>Meal name</label><input id="mn" required placeholder="Chicken & rice"></div><div class="grid2"><div class="field"><label>Calories</label><input id="mc" type="number" min="0" value="0"></div><div class="field"><label>Protein (g)</label><input id="mp" type="number" min="0" value="0"></div><div class="field"><label>Carbs (g)</label><input id="mcarb" type="number" min="0" value="0"></div><div class="field"><label>Fat (g)</label><input id="mfat" type="number" min="0" value="0"></div></div><div class="toolbar"><button type="button" class="secondary" id="closeM">Cancel</button><button class="primary">Add meal</button></div></form></div>`;document.body.appendChild(m);$("#closeM").onclick=()=>m.remove();$("#mf").onsubmit=e=>{e.preventDefault();const u=getUser();u.nutrition[today()]=u.nutrition[today()]||[];u.nutrition[today()].push({name:$("#mn").value,cal:+$("#mc").value||0,pro:+$("#mp").value||0,carb:+$("#mcarb").value||0,fat:+$("#mfat").value||0});setUser(u);m.remove();toast("Meal added");refreshAll()}}
let timerId=null,timerSec=0;function timer(){const box=$("#timer");box.classList.remove("hidden");if(timerId)return;timerSec=0;timerId=setInterval(()=>{timerSec++;$("#time").textContent=`${String(Math.floor(timerSec/60)).padStart(2,"0")}:${String(timerSec%60).padStart(2,"0")}`},1000);$("#resetTimer").onclick=()=>{clearInterval(timerId);timerId=null;timerSec=0;$("#time").textContent="00:00"}}
function checkAchievements(){/* calculated live in Achievements */}

/* Snowfall */
const canvas=$("#snow"),ctx=canvas.getContext("2d");let flakes=[],snowOn=true;function resizeSnow(){canvas.width=innerWidth*devicePixelRatio;canvas.height=innerHeight*devicePixelRatio;canvas.style.width=innerWidth+"px";canvas.style.height=innerHeight+"px";ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);flakes=Array.from({length:Math.min(100,Math.floor(innerWidth/12))},()=>({x:Math.random()*innerWidth,y:Math.random()*innerHeight,r:Math.random()*2.4+.7,v:Math.random()*1.2+.35,dr:(Math.random()-.5)*.45}))}function snow(){if(snowOn){ctx.clearRect(0,0,innerWidth,innerHeight);ctx.fillStyle="rgba(220,244,255,.72)";flakes.forEach(f=>{ctx.beginPath();ctx.arc(f.x,f.y,f.r,0,Math.PI*2);ctx.fill();f.y+=f.v;f.x+=f.dr;if(f.y>innerHeight+5){f.y=-5;f.x=Math.random()*innerWidth}if(f.x>innerWidth)f.x=0;if(f.x<0)f.x=innerWidth})}else ctx.clearRect(0,0,innerWidth,innerHeight);requestAnimationFrame(snow)}resizeSnow();addEventListener("resize",resizeSnow);snow();
function toggleSnow(){const u=getUser();snowOn=!!u?.settings?.snow}
const current=getUser();if(current){snowOn=!!current.settings?.snow;render()}else authScreen();
</script>
</body>
